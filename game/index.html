<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Vault — A Heist Game</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0a0a12; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage { position: relative; width: min(100vw, calc(100vh * 1.6)); aspect-ratio: 1280 / 800; }
  canvas { display: block; width: 100%; height: 100%; background: #14101c; cursor: crosshair; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="800"></canvas>
  </div>
  <script src="src/geom.js"></script>
  <script src="src/world.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/thief.js"></script>
  <script src="src/guards.js"></script>
  <script src="src/cameras.js"></script>
  <script src="src/alarm.js"></script>
  <script src="src/loot.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
